# Hall Monitor Configuration File
# Customize this file to adjust monitoring behavior

[Settings]
# How often to refresh network data (in seconds)
RefreshInterval=5

# Enable traffic logging to file (1=yes, 0=no)
LogTraffic=1

# Enable real-time chart visualization (1=yes, 0=no)
EnableCharts=1

# Chart update frequency in milliseconds
MonitorRefreshRate=2000

# Number of data points to display in charts
ChartDataPoints=30

# Auto-save monitoring data (1=yes, 0=no)
AutoSave=1

[Thresholds]
# Bandwidth threshold for high usage alert (MB/s)
HighBandwidthAlert=100

# Medium bandwidth threshold (MB/s)
MediumBandwidthThreshold=50

# Maximum connected devices before warning
MaxDevicesWarning=50

# CPU usage alert threshold (%)
CPUAlertThreshold=80

[Logging]
# Directory where logs are saved
LogDirectory=logs

# Log filename
LogFile=network-traffic.log

# How many days to keep logs (0 = keep forever)
LogRetention=30

# Log file size limit in MB (0 = unlimited)
MaxLogSize=100

# Enable debug logging (1=yes, 0=no)
DebugLogging=0

[Network]
# Network interface to monitor (leave empty for auto-detect)
NetworkInterface=

# ARP scan timeout in seconds
ARPTimeout=5

# Enable hostname DNS resolution (1=yes, 0=no)
EnableDNSResolution=1

# Maximum devices to scan per network
MaxDevicesToScan=254

# Enable SNMP monitoring (1=yes, 0=no) - requires SNMP installed
EnableSNMP=0

[Display]
# GUI theme (light, dark, blue)
Theme=dark

# Font size for GUI (in points)
FontSize=10

# Color scheme (default, highcontrast, custom)
ColorScheme=default

# Show system tray icon (1=yes, 0=no)
ShowTrayIcon=1

# Minimize to tray on close (1=yes, 0=no)
MinimizeToTray=0

[Advanced]
# Enable experimental features (1=yes, 0=no)
ExperimentalFeatures=0

# PowerShell execution policy (Bypass, RemoteSigned, Unrestricted)
ExecutionPolicy=Bypass

# Enable network packet capture (requires WinPcap) (1=yes, 0=no)
EnablePacketCapture=0

# Buffer size for packet capture (in MB)
PacketCaptureBufferSize=100

# Enable automatic updates check (1=yes, 0=no)
AutoCheckUpdates=1

# Update check interval in days
UpdateCheckInterval=7

[Notifications]
# Enable desktop notifications (1=yes, 0=no)
EnableNotifications=1

# Show notification for high bandwidth (1=yes, 0=no)
NotifyHighBandwidth=1

# Show notification for new devices (1=yes, 0=no)
NotifyNewDevices=0

# Show notification for disconnected devices (1=yes, 0=no)
NotifyDisconnectedDevices=0

# Notification display duration in seconds
NotificationDuration=5

[Export]
# Enable data export (1=yes, 0=no)
EnableExport=1

# Export format (csv, json, xml)
ExportFormat=csv

# Auto-export interval in minutes (0 = disabled)
AutoExportInterval=60

# Export directory
ExportDirectory=exports

[Performance]
# Number of past samples to keep in memory
HistorySize=1000

# Enable performance optimization (1=yes, 0=no)
EnableOptimization=1

# Process monitoring update interval in seconds
ProcessMonitorInterval=5

# Maximum concurrent network operations
MaxConcurrentOperations=10

[Security]
# Enable encryption for logs (1=yes, 0=no)
EncryptLogs=0

# Require authentication for remote access (1=yes, 0=no)
RequireAuth=0

# Minimum password length for authentication
MinPasswordLength=8

# Log security events (1=yes, 0=no)
LogSecurityEvents=1

# Session timeout in minutes
SessionTimeout=30
