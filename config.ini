[Network Monitor Configuration]

[Settings]
# Refresh interval in seconds (default: 5)
RefreshInterval=5

# Enable traffic logging (1=enabled, 0=disabled)
LogTraffic=1

# Enable real-time charts (1=enabled, 0=disabled)
EnableCharts=1

# Continuous monitor refresh rate (milliseconds)
MonitorRefreshRate=2000

[Thresholds]
# Alert threshold for high bandwidth usage (MB/s)
HighBandwidthAlert=100

# Alert threshold for connected devices count
MaxDevicesWarning=50

[Logging]
# Log directory relative to script location
LogDirectory=logs

# Log file name
LogFile=network-traffic.log

# Retention period in days (0 = unlimited)
LogRetention=30

[Network]
# Default network interface (leave empty for auto-detect)
NetworkInterface=

# ARP scan timeout in seconds
ARPTimeout=5

# Enable DNS resolution for devices
EnableDNSResolution=1
